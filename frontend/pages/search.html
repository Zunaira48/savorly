<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Recipes — Savorly</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../styles/base/variables.css">
  <link rel="stylesheet" href="../styles/components/buttons.css">
  <link rel="stylesheet" href="../styles/base/reset.css">
  <link rel="stylesheet" href="../styles/components/navbar.css">
  <link rel="stylesheet" href="../styles/components/card.css">
  <link rel="stylesheet" href="../styles/components/filters.css">
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>

  <nav class="savorly-navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-brand">
        <span class="brand-icon">🍳</span> Savorly
      </a>
      <div class="navbar-links">
        <a href="search.html">Browse</a>
        <a href="favorites.html">Favorites</a>
      </div>
      <button class="theme-toggle" aria-label="Toggle theme">
        <i class="bi bi-moon-stars"></i>
      </button>
    </div>
  </nav>

  <section class="section-block">
    <div class="section-header">
      <h2 id="resultsHeading">Browse Recipes</h2>
      <p id="resultsSubheading">Find exactly what you're craving</p>
    </div>

    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="Search by name..." class="filter-search-input">

      <select id="categoryFilter" class="filter-select">
        <option value="">All Categories</option>
      </select>

      <select id="difficultyFilter" class="filter-select">
        <option value="">Any Difficulty</option>
        <option value="Easy">Easy</option>
        <option value="Medium">Medium</option>
        <option value="Hard">Hard</option>
      </select>

      <select id="timeFilter" class="filter-select">
        <option value="">Any Time</option>
        <option value="15">Under 15 min</option>
        <option value="30">Under 30 min</option>
        <option value="60">Under 1 hour</option>
      </select>

      <button id="applyFiltersBtn" class="btn-primary-glow">Apply</button>
    </div>

    <div id="resultsGrid" class="recipe-grid"></div>
    <p id="noResultsMsg" class="no-results-msg" style="display: none;">No recipes matched your filters — try adjusting them.</p>
  </section>

  <footer class="savorly-footer">
    <p>&copy; 2026 Savorly. Built as a portfolio project.</p>
  </footer>

  <script src="../scripts/utils/favorites.js"></script>
  <script src="../scripts/api/recipeApi.js"></script>
  <script src="../scripts/components/recipeCard.js"></script>
  <script src="../scripts/pages/searchResults.js"></script>
</body>
</html>
